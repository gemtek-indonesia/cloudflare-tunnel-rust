title = "cloudflare-tunnel-rust"

[extend]
useDefault = true

[[allowlists]]
# This exact dependency pair is public metadata; every other match remains scanned.
description = "Public crypto_box dependency pair in Cargo metadata"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)Cargo\.lock$''']
regexTarget = "match"
regexes = ['''^crypto_secretbox",\r?\n[ \t]*"curve25519-dalek"$''']

[[allowlists]]
description = "Verbatim upstream PEM format documentation"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)src/crypto/vendor/boring/src/pkey\.rs$''']
regexTarget = "match"
regexes = ['''^-----BEGIN PRIVATE KEY-----`\.
        #\[corresponds\(PEM_write_bio_PKCS8PrivateKey\)\]
        private_key_to_pem_pkcs8,
        /// Serializes the private key to a PEM-encoded PKCS#8 EncryptedPrivateKeyInfo structure\.
        ///
        /// The output will have a header of `-----BEGIN ENCRYPTED PRIVATE KEY-----$''']

[[allowlists]]
description = "Verbatim upstream PEM format documentation"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)src/crypto/vendor/boring/src/dsa\.rs$''']
regexTarget = "match"
regexes = ['''^-----BEGIN DSA PRIVATE KEY-----`\.
        #\[corresponds\(PEM_write_bio_DSAPrivateKey\)\]
        private_key_to_pem,
        /// Serializes the private key to a PEM-encoded encrypted DSAPrivateKey structure\.
        ///
        /// The output will have a header of `-----BEGIN DSA PRIVATE KEY-----$''']

[[allowlists]]
description = "Verbatim upstream PEM format documentation"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)src/crypto/vendor/boring/src/ec\.rs$''']
regexTarget = "match"
regexes = ['''^-----BEGIN EC PRIVATE KEY-----`\.
        #\[corresponds\(PEM_write_bio_ECPrivateKey\)\]
        private_key_to_pem,
        /// Serializes the private key to a PEM-encoded encrypted ECPrivateKey structure\.
        ///
        /// The output will have a header of `-----BEGIN EC PRIVATE KEY-----$''']

[[allowlists]]
description = "Verbatim upstream PEM format documentation"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)src/crypto/vendor/boring/src/ec\.rs$''']
regexTarget = "match"
regexes = ['''^-----BEGIN EC PRIVATE KEY-----`\.
        #\[corresponds\(PEM_read_bio_ECPrivateKey\)\]
        private_key_from_pem,

        /// Deserializes a private key from a PEM-encoded encrypted ECPrivateKey structure\.
        ///
        /// The input should have a header of `-----BEGIN EC PRIVATE KEY-----$''']

[[allowlists]]
description = "Verbatim upstream PEM format documentation"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)src/crypto/vendor/boring/src/rsa\.rs$''']
regexTarget = "match"
regexes = ['''^-----BEGIN RSA PRIVATE KEY-----`\.
        #\[corresponds\(PEM_write_bio_RSAPrivateKey\)\]
        private_key_to_pem,
        /// Serializes the private key to a PEM-encoded encrypted PKCS#1 RSAPrivateKey structure\.
        ///
        /// The output will have a header of `-----BEGIN RSA PRIVATE KEY-----$''']

