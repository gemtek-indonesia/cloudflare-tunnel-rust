[package]
name = "cloudflare-tunnel-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[lib]
name = "cloudflare_tunnel_rust"

[[bin]]
name = "cloudflared"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
boring = "=5.2.0"
bytes = "1"
capnp = "0.27"
capnp-futures = "0.27"
capnp-rpc = "0.27"
crypto_box = { version = "=0.9.1", features = ["std"] }
futures = "0.3"
h2 = "0.4"
http = "1"
httpdate = "1"
http-body-util = "0.1"
hickory-resolver = "0.26"
ipnet = "2"
idna = "1"
mime = "0.3"
percent-encoding = "2"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
libc = "0.2"
prometheus = { version = "0.14", features = ["process"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
socket2 = "0.6"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-boring = "=5.2.0"
quiche = "=0.30.0"
regex = "1"
regex-syntax = "0.8"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-boring = "=5.2.0"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tokio-quiche = { version = "=0.20.0", default-features = false }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tower-service = "0.3"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
capnpc = "0.27"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[[test]]
name = "interop"
path = "tests/interop/protocol.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[package.metadata.generate-rpm]
assets = []

[patch.crates-io]
datagram-socket = { path = "src/transport/vendor/datagram-socket" }
foundations = { path = "src/transport/vendor/foundations" }
